.btn2{display:inline-flex;align-items:center;justify-content:center;gap:1vh;padding:2vh 3vw;border-radius:99px;font:700 2.5vh Manrope;color:#160e02;background:linear-gradient(180deg,#fbbf24,#d98a06);border:1px solid rgba(255,255,255,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 22px -6px rgba(245,158,11,.55);cursor:pointer;transition:transform .15s cubic-bezier(.22,1,.36,1)}
.btn2:active{transform:scale(.95)}
.btn2.g{color:var(--txt);background:rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.15);border-color:rgba(255,255,255,.14)}
.row{display:flex;gap:1.4vh;flex-wrap:wrap}
#pause{align-items:center;justify-content:center;background:rgba(3,4,6,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pan{width:min(94vw,820px);height:88vh;background:rgba(17,19,24,.94);border:1px solid rgba(255,255,255,.1);border-radius:3vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.tabs{display:flex;gap:1vh;padding:1.6vh 2vh;border-bottom:1px solid rgba(255,255,255,.08)}
.tabs button{flex:1;padding:1.3vh;border-radius:99px;border:0;background:transparent;color:var(--mut);font:700 2.2vh Manrope;cursor:pointer}
.tabs button.on{background:rgba(245,158,11,.16);color:var(--acc)}
.pg{display:none;flex:1;overflow:auto;touch-action:pan-y;padding:1.6vh 2.4vh;-webkit-overflow-scrolling:touch}
.pg.on{display:block}
.pg,.pg *{touch-action:pan-y}
.pg input[type=range]{touch-action:pan-y}
.pg{padding-right:5.6vh!important}
.pan{position:relative}
#sbar{position:absolute;right:.8vh;width:3.2vh;border-radius:99px;background:rgba(255,255,255,.08);display:none;z-index:6;touch-action:none}
#sbar i{position:absolute;left:.35vh;right:.35vh;top:0;border-radius:99px;background:linear-gradient(180deg,#fbbf24,#f59e0b);box-shadow:0 0 0 1px rgba(255,255,255,.25),0 2px 8px rgba(0,0,0,.5)}
.it{display:flex;align-items:center;justify-content:space-between;gap:2vh;padding:1.5vh 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:2.2vh}
.it small{display:block;color:var(--mut);font-size:1.8vh;margin-top:.3vh}
.sw{position:relative;width:7vh;height:4vh;border-radius:99px;background:rgba(255,255,255,.14);flex:none;transition:background .2s;cursor:pointer}
.sw:after{content:"";position:absolute;left:.4vh;top:.4vh;width:3.2vh;height:3.2vh;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.22,1,.36,1)}
.sw.on{background:var(--acc)}.sw.on:after{transform:translateX(3vh)}
input[type=range]{width:34vw;touch-action:pan-x;accent-color:#F59E0B}
.mini{padding:1.2vh 2vh;border-radius:99px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:var(--txt);font:700 2vh Manrope;cursor:pointer}
.mini:active{background:rgba(245,158,11,.3)}
.grid{display:flex;flex-wrap:wrap;gap:1.2vh;padding:1.4vh 0}
.pan h3{margin:2vh 0 .4vh;font:700 1.9vh Manrope;color:var(--acc);letter-spacing:.14em;text-transform:uppercase}
#end{align-items:center;justify-content:center;flex-direction:column;text-align:center;background:rgba(0,0,0,.82);gap:2.4vh}
#end h2{margin:0;font:700 8vh/1 Unbounded,system-ui;letter-spacing:-.04em}
#end p{margin:0;color:var(--mut);font-size:2.4vh;max-width:60vw;line-height:1.5}
#scare{position:fixed;inset:0;z-index:95;display:none;background:#000;align-items:center;justify-content:center;overflow:hidden;pointer-events:none}
#scare canvas{position:static;inset:auto;height:100vh;width:100vh}
#scare.go canvas{animation:zm .95s cubic-bezier(.1,.8,.2,1) both}
@keyframes zm{0%{transform:scale(.5)}12%{transform:scale(1.15) translate(1%,-1%)}20%{transform:scale(1.05) translate(-2%,1%)}30%{transform:scale(1.3) translate(2%,0)}100%{transform:scale(2.1)}}
#scare:after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(160,0,0,0) 30%,rgba(120,0,0,.75) 100%);animation:fl .1s infinite alternate}
@keyframes fl{to{opacity:.35}}
#editor{position:fixed;left:50%;bottom:2vh;transform:translateX(-50%);z-index:80;display:none;flex-direction:column;gap:1vh;padding:1.4vh 2vh;border-radius:2.4vh;background:rgba(10,11,14,.92);border:1px solid rgba(255,255,255,.14);width:min(92vw,760px)}
body.editing #editor{display:flex}
.et{font:600 2vh Manrope;color:var(--mut);text-align:center}
#codeBox{width:100%;height:6vh;background:#0b0c0f;color:#ddd;border:1px solid rgba(255,255,255,.14);border-radius:1vh;font:1.7vh monospace;-webkit-user-select:text;user-select:text;touch-action:auto;resize:none}

body.editing .b.sel{outline:2px solid #F59E0B}

#rotate{position:fixed;inset:0;z-index:100;background:#050608;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:8vw;font:700 22px Unbounded,system-ui}
#rotate span{margin-top:14px;font:500 15px Manrope;color:var(--mut)}
@media (orientation:portrait){#rotate{display:flex}}

@keyframes arnexLogoAnim{0%{opacity:0;transform:scale(.82) translateY(16px);letter-spacing:.55em;filter:blur(8px)}50%{opacity:1;transform:scale(1.04) translateY(0);letter-spacing:.26em;filter:blur(0)}100%{opacity:1;transform:scale(1) translateY(0);letter-spacing:.22em;filter:blur(0)}}
@keyframes arnexSubAnim{0%,25%{opacity:0;transform:translateY(10px);letter-spacing:.65em}100%{opacity:1;transform:translateY(0);letter-spacing:.44em}}

#splash b{animation:arnexLogoAnim 1.4s cubic-bezier(.16,1,.3,1) forwards;color:#ffaa33;text-shadow:0 0 28px rgba(255,140,40,.65),0 0 60px rgba(225,29,72,.45)}

#splash .arnex-ver{margin-top:1.4vh;font:700 clamp(9px,1.5vh,12px) monospace;color:#9ec8ff;letter-spacing:.25em;padding:.5vh 1.4vh;border-radius:99px;background:rgba(255,170,50,.12);border:1px solid rgba(255,170,50,.35)}

.btn2 svg{width:2.5vh;height:2.5vh;stroke:currentColor;stroke-width:2.4;fill:none;flex-shrink:0}

/* COMPACT CLEAN SETTINGS LABELS ONLY ("\u0432 \u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0430\u0445 \u0442\u0435\u043A\u0441\u0442 \u0431\u043E\u043B\u044C\u0448\u043E\u0439 \u0443\u0431\u0435\u0440\u0438 \u0442\u043E\u043B\u044C\u043A\u043E \u043D\u0430\u0434\u043F\u0438\u0441\u0438 \u0438 \u0432\u0441\u0435") */
.it{padding:.9vh 0!important;gap:1.5vh!important;font-size:2.05vh!important;font-weight:700!important}
.it small{display:none!important}

<div class="ov" id="menu">
  <div class="l">

function boxGeo(w,h,d,tile){tile=tile||2;const g=new THREE.BoxGeometry(w,h,d);const uv=g.attributes.uv;const dm=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];for(let f=0;f<6;f++)for(let i=0;i<4;i++){const k=f*4+i;uv.setXY(k,uv.getX(k)*dm[f][0]/tile,uv.getY(k)*dm[f][1]/tile);}return g;}
function rbox(w,h,d,r,mat){const bev=Math.max(.004,Math.min(r*.6,d/4,w/4,h/4));const bs=bev*.8;const sw=w-2*bs,sh=h-2*bs;const rad=Math.max(.002,Math.min(r,sw/2-.001,sh/2-.001));const x=-sw/2,y=-sh/2;const s=new THREE.Shape();s.moveTo(x+rad,y);s.lineTo(x+sw-rad,y);s.quadraticCurveTo(x+sw,y,x+sw,y+rad);s.lineTo(x+sw,y+sh-rad);s.quadraticCurveTo(x+sw,y+sh,x+sw-rad,y+sh);s.lineTo(x+rad,y+sh);s.quadraticCurveTo(x,y+sh,x,y+sh-rad);s.lineTo(x,y+rad);s.quadraticCurveTo(x,y,x+rad,y);
 const dp=Math.max(.001,d-2*bev);const g=new THREE.ExtrudeGeometry(s,{depth:dp,bevelEnabled:true,bevelThickness:bev,bevelSize:bs,bevelSegments:1,curveSegments:3});g.translate(0,0,-dp/2);return new THREE.Mesh(g,mat);}

 IA.forEach(a=>{if(d.done.includes(a.id)){a.done=true;if(a.prop)a.prop.visible=false;}});if(d.cur)equip(d.cur);planRaids();startPlay();dayCard(S.day);}

  // Dynamic Ambient Soundscape System: changes according to Current Day (1..7) and Noise Level (0..100)
  function stepDynamicAmbience(dt) {
    if (S.mode !== 'play' || S.paused) return;
    const day = Math.max(1, Math.min(7, S.day || 1));
    const noiseVal = Math.max(0, Math.min(100, P.noise || 0));
    const panicVal = Math.max(0, Math.min(1, P.panic || 0));

    let stageLabel = '\u0421\u041A\u0420\u0418\u041F \u0414\u041E\u041C\u0410';
    let baseFreq = 42;
    if (day >= 5) {
      stageLabel = '\u0413\u0423\u041B \u0411\u0415\u0417\u0414\u041D\u042B';
      baseFreq = 28;
    } else if (day >= 3) {
      stageLabel = '\u0413\u0423\u041B \u0422\u0420\u0423\u0411';
      baseFreq = 35;
    }

    let noiseState = '\u0422\u0418\u0428\u0418\u041D\u0410';
    let txtCol = '#6ee7b7';
    if (noiseVal >= 60 || panicVal >= 0.65) {
      noiseState = '\u041E\u0425\u041E\u0422\u0410!';
      txtCol = '#fda4af';
    } else if (noiseVal >= 30 || panicVal >= 0.25) {
      noiseState = '\u042D\u0425\u041E \u0428\u0423\u041C\u0410';
      txtCol = '#fcd34d';
    }

    if (ambienceStatusTxt) {
      ambienceStatusTxt.textContent = '\u0414' + day + ' \xB7 ' + stageLabel + ' \xB7 ' + noiseState;
      ambienceStatusTxt.style.color = txtCol;
    }

    ambPulseCd -= dt;
    if (ambPulseCd <= 0) {
      const interval = noiseVal >= 60 ? 1.8 : noiseVal >= 30 ? 3.2 : Math.max(3.6, 6.8 - day * 0.45);
      ambPulseCd = interval;
      if (noiseVal >= 60) {
        // High noise: oppressive sub-bass throb + metallic shrieking resonance
        tone({ type: 'sawtooth', f: baseFreq + 18, f2: baseFreq * 0.8, vol: 0.18, d: 1.1, a: 0.06 });
        tone({ type: 'triangle', f: 480 + day * 25, f2: 430, vol: 0.08, d: 0.75, a: 0.05 });
        nburst({ type: 'bandpass', f: 680 + noiseVal * 4, f2: 260, vol: 0.11, d: 0.8, q: 2.8 });
      } else if (noiseVal >= 30 || day >= 3) {
        // Medium noise or Day 3+: metallic pipe hum + eerie wood creak response
        tone({ type: 'triangle', f: baseFreq * 2, f2: baseFreq * 1.4, vol: 0.11, d: 1.3, a: 0.1 });
        nburst({ type: 'bandpass', f: 320 + day * 40 + noiseVal * 2, f2: 190, vol: 0.065, d: 0.65, q: 3.2 });
      } else {
        // Quiet Day 1-2: deep old-house room tone + settling floorboard creak
        tone({ type: 'sine', f: baseFreq * 3.2, f2: baseFreq * 2.1, vol: 0.055, d: 0.55, a: 0.04 });
      }
    }
  }

  // Frame-accurate animation for 3D First-Person Legs + Real-Time ECG Pulse Sensor & Panting ("\u041E\u0442\u0434\u044B\u0448\u043A\u0430")
  let lastLegT = performance.now();
  let pantAudioCd = 0;
  function updateLegsLoop(now) {
    requestAnimationFrame(updateLegsLoop);
    const dt = Math.min(0.05, (now - lastLegT) / 1000);
    lastLegT = now;
    if (S.mode !== 'play') {
      legsGroup.visible = false;
      return;
    }

    // Adrenaline boost & sprint stamina / \u043E\u0442\u0434\u044B\u0448\u043A\u0430
    if (adrenBoostT > 0) {
      adrenBoostT = Math.max(0, adrenBoostT - dt);
      P.breath = 100;
      P.panic = Math.max(0, P.panic - dt * 0.5);
    } else if (P.run && P.moving && !S.hidden) {
      P.breath = Math.max(0, (P.breath ?? 100) - dt * 24);
      P.panic = Math.min(1, (P.panic || 0) + dt * 0.08);
    }

    // Real-Time ECG Pulse Sensor & Panting ("\u041E\u0442\u0434\u044B\u0448\u043A\u0430") update
    const panicVal = Math.max(0, Math.min(1, P.panic || 0));
    const breathVal = Math.max(0, Math.min(100, P.breath ?? 100));
    const pantLevel = Math.max(0, Math.min(1, Math.max(panicVal * 1.15, (62 - breathVal) / 62)));
    const bpm = Math.round(64 + panicVal * 114 + (100 - breathVal) * 0.46 + (S.raid ? 16 : 0) + (adrenBoostT > 0 ? 28 : 0));
    const beatFreqHz = bpm / 60;
